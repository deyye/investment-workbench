# 政策分类口径配置
#
# ── 口径来源（两处权威依据，改动前必须核对） ──────────────────────────
#   1) 任务书《（二）研究利用大模型定期采集投资项目政策文件并落地数据库》原文
#   2) 业务方（浙江省经济信息中心）2026-09-11 微信确认口径
#
# ── 收录判据：两个条件必须同时满足 ────────────────────────────────
#   A. 是正式政策文件   —— 排除会议通知、人事任免、结果公示等信息发布类
#   B. 内容实质涉及投资项目 —— 业务方口径："讲到投资的且是正式文件就收"，
#                            不要求整篇以投资项目为主（部分条款涉及即收）
#
# ── 分类：允许多类 ────────────────────────────────────────────
#   业务方 2026-09-11 确认："可以归多类的"
#
# ── 排除：面向存量企业日常运行的政策 ──────────────────────────────
#   业务方 2026-09-11 确认：钢铁差别化电价、工商业分时电价这类不收
#
# 本文件同时作为 LLM 分类的业务口径提示词注入，保证规则模式与模型模式口径一致。

taxonomy_version: "2026-09-11"

relevance:
  # ── 条件 A：是否属于本库业务范围 ────────────────────────────
  # 概念校正（重要）：这里判断的**不是**"它是不是行政规范性文件"。
  # "行政规范性文件"是法律概念，《浙江省行政规范性文件管理办法》有严格定义
  # （依法制定、公开发布、涉及权利义务、具有普遍约束力、可反复适用）。
  # 本库要判断的是：**它是不是本库业务范围内值得归集的政策性文件**。
  # 二者不等价——「实施意见」「工作方案」「专项规划」在法律意义上未必属于规范性文件，
  # 但完全可能含有项目申报条件、投资方向、建设任务、资金安排，对本库应当收录。
  # 故采用「排除法」：默认在范围内，命中 exclude_types 才排除。
  # 反排除豁免词（"办法/规定/制度"等）写在代码常量 POLICY_FORM_EXEMPT 中，
  # 刻意不含"通知"——否则"关于召开××会议的通知"会被错当成政策收进来。
  # 文件类型识别见本文件末尾的 doc_types。
  policy_document_scope:
    # 信息发布类：不是政策正文，不属于本库业务范围
    #
    # ⚠️ 分两组，因为**反误杀豁免只对第一组成立**（见 classifier.py 的 POLICY_FORM_EXEMPT）：
    #   exclude_types      —— 词根类，可能与政策标题共存。"联席会议制度""采购管理办法"
    #                         确实是政策，所以标题含 办法/规定/方案/规划 等时不排除。
    #   exclude_types_hard —— 事务性类，出现即说明是事务公告。**豁免不适用**。
    #
    # 为什么必须分开（2026-09-14 实测）：库里 54 条标题含这类词，其中 16 条被判「收」。
    # 那 16 条里 14 条是 比选/中选/招募/获奖/公示/采购 这类事务公告，但按词根类规则
    # 它们标题里的"方案""规划"触发了豁免，于是照样判「收」——
    # 例如《关于比选〈…项目实施方案〉研究承担单位的公告》就因为有"方案"二字被放过。
    # 逐个测过波及面：下面的硬排除词在 607 条库里命中 16 条、**零误杀**；
    # 而「名单」命中 3 条里有 2 条是该收的（《国家级零碳园区建设名单》），故**不列入**。
    exclude_types_hard:
      - "比选"
      - "中选"
      - "遴选"
      - "招募"
      - "询价"
      - "获奖"
      - "公示"
      - "公众参与"
      - "研究承担单位"

    exclude_types:
      - "会议"
      - "座谈会"
      - "人事"
      - "任免"
      - "公示名单"
      - "采购公告"
      - "招标公告"
      - "中标"
      - "成交结果"
      - "解读"
      - "一图读懂"
      - "问答"

  # ── 条件 B：是否对投资项目产生实质影响 ──────────────────────
  # 顶层判据（业务语义定义，不是关键词清单）：
  #   一份文件应被收录，当它对**固定资产投资项目的形成、决策、审批、建设、
  #   要素保障、资金支持、监管或评价**，产生**普遍适用的**规则、要求或支持。
  #
  # 由此推出两组强判据（命中任一即判定相关），它们共同覆盖上述定义：
  #   B1 strong_keywords    —— "投资/项目"类表述
  #   B2 lifecycle_keywords —— 项目生命周期各环节的专有表述
  #
  # 为什么要 B2：有些重要的投资项目政策通篇讲具体管理环节（用地预审、节能审查、
  # 竣工验收……），未必频繁出现"投资"二字。只靠 B1 会漏收。
  # 而弱词（"投资/项目/审批"等通用词）单独出现不构成理由——它无法回答
  # "文件在讲什么"，只能回答"文中出现过什么词"（《公墓价格管理》误收即由此产生）。

  strong_keywords:      # B1 明确指向投资项目管理的表述，命中 1 个即可判定相关
    - "固定资产投资项目"
    - "企业投资项目"
    - "政府投资项目"
    - "投资项目"
    - "中央预算内投资"
    - "专项债券"
    - "重大项目"
    - "重点工程"
    - "工程建设项目"
    - "投资管理"
    - "投资计划"
    - "项目审批"
    - "项目核准"
    - "项目备案"
    - "项目单位"
    - "项目资金"
    - "专项资金"
    - "项目申报"
    - "项目库"
    - "项目建设"

  # B2 项目生命周期各环节的专有表述，命中 1 个即判定相关。
  # 这批词回答的是"文件在管项目哪个环节"，而不是"文中出现过什么词"——
  # 用于堵住「通篇讲用地报批、节能审查、竣工验收，却很少出现'投资'二字」的漏收。
  # 与 B1 不重复；重复项（项目审批/核准/备案、专项资金、项目库）已在 B1 中。
  lifecycle_keywords:
    # 储备与决策
    - "项目储备"
    - "可行性研究"
    - "项目建议书"
    - "投资决策"
    # 审批核准
    - "核准目录"
    - "审批权限"
    - "投资项目管理"
    # 用地与规划
    - "用地预审"
    - "规划选址"
    - "土地报批"
    - "用地指标"
    - "土地供应"
    # 专项评估
    - "环境影响评价"
    - "节能审查"
    - "能耗审查"
    - "水土保持"
    - "社会稳定风险"
    - "安全评价"
    # 建设实施
    - "施工许可"
    - "施工图审查"
    - "招标投标"
    - "工程监理"
    - "竣工验收"
    # 资金保障
    - "项目资本金"
    - "投资补助"
    - "贷款贴息"
    # 监管评价
    - "项目监管"
    - "绩效评价"
    - "后评价"
    - "项目稽察"

  weak_keywords:        # 通用词，单独出现不足以说明与本库主题相关
    - "投资"
    - "项目"
    - "审批"
    - "核准"
    - "备案"
    - "申报"
    - "建设"

  # 标题命中即视为主题相关（标题最能代表文件主旨）。
  # 此处只保留真正指向投资建设领域的词——"产业""基础设施"一类过于宽泛，
  # 会让《关于促进文化产业高质量发展的意见》这类文件凭标题就被判为相关。
  title_keywords:
    - "投资"
    - "项目"
    - "工程"
    - "建设"

  # 正文弱词命中数达到该值时判为待判定（交模型或人工），不直接判定为相关
  weak_pending_threshold: 4

  # 只有 1 个强档词命中、且标题未体现投资主题时，证据偏薄：
  # 可能是偶然提及、否定语境（"不涉及项目审批"）或引用他文（"根据《企业投资项目…条例》"）。
  # 此类仍判「收」（对应业务方"讲到投资的就收"的低门槛），但不直接自动确认，
  # 转「待复核结论」由人工过一眼，避免误收静默进库。
  min_strong_for_auto_confirm: 2

  # ── 排除：面向存量企业运行的政策 ────────────────────────────
  # ⚠️ 这是**业务边界**，不是客观政策分类，表述时不可混淆。
  #   不能说"电价政策不属于投资项目政策"——差别化电价、峰谷电价本身就是政策，
  #   某些情况下也确实影响项目投资测算与运营经济性。
  #   正确表述：**根据本任务业务边界，纯运行端电价政策暂不纳入**；
  #   若文件同时直接规定新建项目的准入、审批、建设条件，则本条不适用（见下方例外）。
  # 依据：业务方 2026-09-11 确认。
  exclude_operational:
    markers:
      - "差别化电价"
      - "分时电价"
      - "峰谷电价"
      - "阶梯电价"
      - "有序用电"
    # 标题同时含以下词时，说明确实指向建设项目，不适用排除
    override_markers:
      - "项目"
      - "工程"
      - "建设"

categories:
  guide:            # 引导类：解决"往哪投"，明确投资鼓励发展方向
    name: 引导类
    keywords:
      - "发展规划"
      - "规划"
      - "产业导向"
      - "导向目录"
      - "产业目录"
      - "区域布局"
      - "布局指引"
      - "鼓励发展"
      - "支持方向"
      - "重点领域"
      - "鼓励类"
      - "优先发展"
      - "投资方向"
      - "发展导向"
      - "产业政策"
    evidence_hint: 用于判断文件对投资方向、产业布局、鼓励领域的引导作用

  access:           # 准入类：解决"让不让投"，项目前置准入门槛
    name: 准入类
    keywords:
      - "核准"
      - "备案"
      - "审批"
      - "市场准入"
      - "负面清单"
      - "前置条件"
      - "准入门槛"
      - "节能审查"
      - "能耗审查"
      - "环评"
      - "环境影响评价"
      - "许可"
      - "核准目录"
      - "投资项目管理"
    evidence_hint: 用于判断项目准入、核准备案制度与前置条件

  guarantee:        # 保障类：解决"靠什么投"，要素供给及倾斜支持
    name: 保障类
    keywords:
      - "用地"
      - "土地"
      - "要素保障"
      - "用地保障"
      - "资金支持"
      - "信贷"
      - "融资"
      - "专项债券"
      - "基金"
      - "财政资金"
      - "能耗指标"
      - "指标保障"
      - "人才"
      - "要素供给"
      - "倾斜支持"
    evidence_hint: 用于判断土地、资金、信贷、能耗、人才等要素供给安排

  incentive:        # 激励约束类：解决"投了怎样"，正向激励＋约束管理
    name: 激励约束类
    keywords:
      - "奖补"
      - "补贴"
      - "奖励"
      - "税收优惠"
      - "减免"
      - "价格支持"
      - "上网电价"
      - "绩效考核"
      - "绩效评价"
      - "后评价"
      - "监管"
      - "检查"
      - "惩戒"
      - "责任追究"
      - "约谈"
      - "问责"
      - "退出机制"
    evidence_hint: 用于判断奖补优惠、价格支持、全过程监管与责任约束

# 交叉/易混样例：规则与 LLM 共同参考，命中即倾向标记待确认（不直接判错）
boundary_cases:
  - title_hint: "能耗双控"
    note: 规定项目能耗准入条件→准入类；安排能耗指标保障→保障类。须看条款实际作用。
  - title_hint: "节能审查"
    note: 作为项目前置门槛→准入类；作为用能指标保障→保障类。
  - title_hint: "中央预算内投资管理办法"
    note: 涉及资金分配（保障）与申报条件（准入），通常多标签。
  - title_hint: "招投标"
    note: 工程建设项目的招投标监管属"项目全过程监管"，归激励约束类（任务书原文含"项目全过程监管"）。
  - title_hint: "信用记录"
    note: 判断对象是"项目"而非"市场主体"。要求企业提供信用报告属企业资格管理，不构成项目准入门槛；
          仅当条款直接针对项目申报、项目资金申请时收录。泛谈信用体系建设的判否。
  - title_hint: "实施细则"
    note: 细则类文件多类混杂，允许多标签，不强行单标签。

doc_types:
  # 文件类型识别，供正文与入库记录使用
  formal: ["通知", "意见", "办法", "规划", "方案", "规定", "决定", "条例", "细则", "指引", "目录", "标准"]
  notice: ["申报", "征集", "组织申报", "开展申报", "报送"]
  interpretation: ["解读", "问答", "一图读懂", "说明"]
  draft: ["征求意见稿", "公开征求意见"]
  approval: ["批复", "核准批复"]

audit:
  # 待办类型（取代笼统的 need_review，由分类环节自动推导，不手工置位）
  todo_types:
    none: 无需人工介入
    material: 材料不完整，机器可自修（补下载/重解析），不计入业务待办
    system: 系统或模型故障，需运维处理
    candidate: 规则判正且证据强——业务**抽检**翻转，不自动入库（业务方 2026-09-14 裁定的中间档）
    review: 结论待确认（多类混杂、命中边界样例），需业务方查看
    scope: 口径待定（相关性判不出来），需业务方拍板
  # 需要业务方复核的具体情形
  need_review_if:
    - 多类命中且得分相同，无法区分主次
    - 命中边界样例关键词
    - 相关性无法判定（既未命中投资关键词，也未被明确排除）
