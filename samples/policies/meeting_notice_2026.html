  <h1>关于召开全省投资领域重点工作推进会议的通知</h1>
  <p class="meta">会议通知</p>
  <div class="TRS_Editor">
    <p>各设区市发展改革委：</p>
    <p>定于2026年6月5日在杭州召开全省投资领域重点工作推进会议，请各单位分管负责同志参加。</p>
    <p>会议主要内容：通报重大项目投资完成情况，部署下半年扩大有效投资重点任务。请提前做好汇报准备。</p>
